<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>林內召會收支記帳 - 請款</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#4338CA">
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { font-family:'Inter',"Microsoft JhengHei",sans-serif; background:#F8FAFC; }
  input, select, textarea { font-size:16px !important; }
  .card { background:#fff; border:1px solid #e2e8f0; border-radius:16px; }
  .badge { display:inline-flex; align-items:center; padding:3px 12px; border-radius:999px; font-size:14px; font-weight:800; }
  .chip { display:inline-flex; align-items:center; padding:10px 16px; border-radius:999px; font-size:16px; font-weight:800; background:#f1f5f9; color:#475569; cursor:pointer; border:1.5px solid #e2e8f0; transition:all .1s; }
  .chip.selected { background:#eef2ff; color:#4338ca; border-color:#6366f1; }
</style>
</head>
<body class="text-slate-900 min-h-screen pb-16 overflow-x-hidden">

<header class="sticky top-0 z-40 bg-white/85 backdrop-blur border-b border-slate-200/60">
  <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-black text-lg">林</div>
      <span class="font-black text-slate-800 text-lg">林內召會收支記帳</span>
    </div>
    <div class="flex items-center gap-3 text-base font-bold">
      <span class="text-slate-800">請款</span>
      <a href="/income.html" class="text-slate-400 hover:text-indigo-600">奉獻</a>
      <a href="/ledger.html" class="text-slate-400 hover:text-indigo-600">記帳</a>
    </div>
  </div>
</header>

<main class="max-w-3xl mx-auto px-4 pt-5 space-y-5">

  <!-- New Request -->
  <div id="formCard" class="card p-5 space-y-4">
    <div class="flex items-center justify-between">
      <h2 id="formTitle" class="text-lg font-black text-slate-400 uppercase tracking-widest">新增請款申請</h2>
      <button id="cancelEditBtn" onclick="cancelEdit()" class="hidden text-[15px] font-bold text-rose-500 px-2 py-1 rounded-lg hover:bg-rose-50">取消編輯</button>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div class="space-y-1">
        <label class="text-[14px] font-bold text-slate-400 ml-1">花費日期</label>
        <input type="date" id="fDate" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-100 rounded-xl outline-none text-lg font-bold">
      </div>
      <div class="space-y-1">
        <label class="text-[14px] font-bold text-slate-400 ml-1">請款人</label>
        <input type="text" id="fRequester" placeholder="姓名" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-100 rounded-xl outline-none text-lg font-bold">
      </div>
    </div>

    <div class="space-y-2">
      <label class="text-[14px] font-bold text-slate-400 ml-1">用途</label>
      <div id="purposeChips" class="flex flex-wrap gap-2"></div>
      <input type="text" id="fPurposeDetail" placeholder="請輸入名稱" class="hidden w-full px-3 py-2.5 bg-slate-50 border border-slate-100 rounded-xl outline-none text-lg font-bold">
    </div>

    <div class="space-y-2">
      <div class="flex items-center justify-between">
        <label class="text-[14px] font-bold text-slate-400 ml-1">品項</label>
        <button onclick="addItemRow()" class="text-[15px] font-bold text-indigo-600 px-2 py-1 rounded-lg hover:bg-indigo-50">+ 新增品項</button>
      </div>
      <div id="itemRows" class="space-y-2"></div>
    </div>

    <div class="space-y-2">
      <div class="flex items-center justify-between">
        <label class="text-[14px] font-bold text-slate-400 ml-1">發票／收據照片</label>
        <label class="text-[15px] font-bold text-indigo-600 px-2 py-1 rounded-lg hover:bg-indigo-50 cursor-pointer">
          + 上傳照片
          <input type="file" accept="image/*,application/pdf" capture="environment" multiple class="hidden" onchange="handleReceiptUpload(this)">
        </label>
      </div>
      <div id="receiptThumbs" class="flex flex-wrap gap-2"></div>
    </div>

    <div class="bg-indigo-50 border border-indigo-100 rounded-xl px-4 py-3 flex items-center justify-between">
      <span class="text-base font-bold text-indigo-400">總金額</span>
      <span id="totalPreview" class="text-2xl font-black text-indigo-700">NT$ 0</span>
    </div>

    <button onclick="submitRequest()" class="w-full bg-indigo-600 text-white py-3.5 rounded-xl font-black text-lg shadow-lg shadow-indigo-100"><span id="submitBtnText">送出請款申請</span></button>
  </div>

  <!-- List -->
  <div class="card overflow-hidden">
    <div class="px-5 pt-5 pb-3 flex items-center justify-between">
      <h2 class="text-lg font-black text-slate-400 uppercase tracking-widest">我的請款紀錄</h2>
      <input type="month" id="monthFilter" class="text-base font-bold px-2 py-1.5 bg-slate-50 border border-slate-100 rounded-lg outline-none">
    </div>
    <div id="reqList" class="px-4 pb-5 space-y-2"></div>
  </div>

</main>

<script src="/assets/common.js"></script>
<script>
let items = [];
let receiptKeys = [];
let selectedPurpose = '';
let editingId = null;

const PURPOSE_OPTIONS = ['兒少活動', '兒少愛宴', '主日愛宴', '會所物品採購', '相調支出', '特會支出', '其他'];

function genRowId() { return 'r' + Math.random().toString(36).slice(2, 9); }

function renderPurposeChips() {
  const c = document.getElementById('purposeChips');
  c.innerHTML = PURPOSE_OPTIONS.map(p => `
    <button type="button" onclick="selectPurpose('${p}')" class="chip ${selectedPurpose === p ? 'selected' : ''}">${p}</button>
  `).join('');
  const detailInput = document.getElementById('fPurposeDetail');
  detailInput.classList.toggle('hidden', !selectedPurpose);
  detailInput.placeholder = '請輸入名稱';
}
function selectPurpose(p) {
  selectedPurpose = p;
  document.getElementById('fPurposeDetail').value = '';
  renderPurposeChips();
}
function getPurposeValue() {
  if (!selectedPurpose) return '';
  const detail = document.getElementById('fPurposeDetail').value.trim();
  return detail ? selectedPurpose + '：' + detail : selectedPurpose;
}

// 這支手機自己送出過的請款單，只存在本機 localStorage，不會上傳到伺服器
function getMyRequestIds() {
  try { return JSON.parse(localStorage.getItem('my_expense_request_ids')) || []; } catch (e) { return []; }
}
function saveMyRequestId(id) {
  const ids = getMyRequestIds();
  if (!ids.includes(id)) {
    ids.unshift(id);
    localStorage.setItem('my_expense_request_ids', JSON.stringify(ids.slice(0, 300)));
  }
}

async function handleReceiptUpload(input) {
  const files = Array.from(input.files || []);
  input.value = '';
  for (const file of files) {
    try {
      const fd = new FormData();
      fd.append('file', file);
      const res = await fetch('/api/expenses/upload', { method: 'POST', body: fd });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || '上傳失敗');
      receiptKeys.push(data.key);
      renderReceiptThumbs();
    } catch (e) { toast(e.message, true); }
  }
}
function removeReceipt(key) {
  receiptKeys = receiptKeys.filter(k => k !== key);
  renderReceiptThumbs();
}
function receiptThumbHTML(key, removable) {
  const isPdf = key.toLowerCase().endsWith('.pdf');
  const body = isPdf
    ? `<div class="w-16 h-16 flex items-center justify-center rounded-lg border border-slate-200 bg-slate-50 text-[14px] font-black text-slate-500">PDF</div>`
    : `<img src="${fileUrl(key)}" class="w-16 h-16 object-cover rounded-lg border border-slate-200">`;
  return `<div class="relative">${body}${removable ? `<button onclick="removeReceipt('${key}')" class="absolute -top-1.5 -right-1.5 bg-rose-500 text-white rounded-full w-5 h-5 text-[14px] font-black flex items-center justify-center">✕</button>` : ''}</div>`;
}
function renderReceiptThumbs() {
  const c = document.getElementById('receiptThumbs');
  c.innerHTML = receiptKeys.length === 0
    ? '<p class="text-base text-slate-300">尚未上傳照片</p>'
    : receiptKeys.map(k => receiptThumbHTML(k, true)).join('');
}

function addItemRow(name, unit_price, qty) {
  items.push({ rid: genRowId(), name: name || '', unit_price: unit_price || '', qty: qty || 1 });
  renderItemRows();
}
function removeItemRow(rid) {
  items = items.filter(i => i.rid !== rid);
  renderItemRows();
}
function updateItemRow(rid, field, value) {
  const it = items.find(i => i.rid === rid);
  if (it) it[field] = value;
  updateTotal();
}
function renderItemRows() {
  const c = document.getElementById('itemRows');
  if (items.length === 0) {
    c.innerHTML = '<p class="text-base text-slate-300 text-center py-3">請新增品項</p>';
    return;
  }
  c.innerHTML = items.map(it => `
    <div class="bg-slate-50 border border-slate-100 rounded-xl p-3 space-y-2">
      <div class="flex items-center gap-2">
        <input type="text" placeholder="品名" value="${esc(it.name)}" oninput="updateItemRow('${it.rid}','name',this.value)"
          class="flex-1 min-w-0 px-3 py-1.5 bg-white border border-slate-100 rounded-lg outline-none text-lg font-bold">
        <button onclick="removeItemRow('${it.rid}')" class="text-slate-300 hover:text-rose-500 p-1">✕</button>
      </div>
      <div class="grid grid-cols-3 gap-2">
        <div><label class="text-[13px] font-bold text-slate-400">單價</label>
          <input type="number" value="${it.unit_price}" oninput="updateItemRow('${it.rid}','unit_price',+this.value)"
            class="w-full px-2 py-1.5 bg-white border border-slate-100 rounded-lg outline-none text-base font-black"></div>
        <div><label class="text-[13px] font-bold text-slate-400">數量</label>
          <input type="number" value="${it.qty}" oninput="updateItemRow('${it.rid}','qty',+this.value)"
            class="w-full px-2 py-1.5 bg-white border border-slate-100 rounded-lg outline-none text-base font-black"></div>
        <div><label class="text-[13px] font-bold text-slate-400">總價</label>
          <div class="w-full px-2 py-1.5 bg-slate-100 rounded-lg text-base font-black text-slate-500">${fmtMoney((Number(it.unit_price)||0)*(Number(it.qty)||0))}</div></div>
      </div>
    </div>
  `).join('');
  updateTotal();
}
function updateTotal() {
  const total = items.reduce((s, i) => s + (Number(i.unit_price) || 0) * (Number(i.qty) || 0), 0);
  document.getElementById('totalPreview').textContent = fmtMoney(total);
}

function resetForm() {
  editingId = null;
  document.getElementById('formTitle').textContent = '新增請款申請';
  document.getElementById('submitBtnText').textContent = '送出請款申請';
  document.getElementById('cancelEditBtn').classList.add('hidden');
  document.getElementById('fRequester').value = '';
  selectedPurpose = '';
  document.getElementById('fPurposeDetail').value = '';
  renderPurposeChips();
  items = [];
  receiptKeys = [];
  addItemRow();
  renderReceiptThumbs();
}

function cancelEdit() {
  resetForm();
  document.getElementById('fDate').value = todayStr();
}

function editRequest(r) {
  editingId = r.id;
  document.getElementById('formTitle').textContent = '編輯請款申請';
  document.getElementById('submitBtnText').textContent = '更新請款申請';
  document.getElementById('cancelEditBtn').classList.remove('hidden');

  document.getElementById('fDate').value = r.expense_date;
  document.getElementById('fRequester').value = r.requester;

  const parts = r.purpose.split('：');
  selectedPurpose = parts[0];
  document.getElementById('fPurposeDetail').value = parts.slice(1).join('：') || '';
  renderPurposeChips();

  items = r.items.map(it => ({ rid: genRowId(), name: it.name, unit_price: it.unit_price, qty: it.qty }));
  renderItemRows();

  receiptKeys = r.receipts.map(rc => rc.file_key);
  renderReceiptThumbs();

  document.getElementById('formCard').scrollIntoView({ behavior: 'smooth' });
}

async function submitRequest() {
  const expense_date = document.getElementById('fDate').value;
  const requester = document.getElementById('fRequester').value.trim();
  const purpose = getPurposeValue();
  if (!expense_date) return toast('請選擇花費日期', true);
  if (!requester) return toast('請填寫請款人', true);
  if (!selectedPurpose) return toast('請選擇用途', true);
  if (!document.getElementById('fPurposeDetail').value.trim()) return toast('請輸入名稱', true);
  const validItems = items.filter(i => i.name && Number(i.unit_price) >= 0 && Number(i.qty) > 0);
  if (validItems.length === 0) return toast('請至少填寫一項品項', true);

  const body = { expense_date, requester, purpose, items: validItems, receipt_keys: receiptKeys };
  try {
    if (editingId) {
      await api('/api/expenses/' + editingId, { method: 'PATCH', body });
      toast('請款申請已更新');
    } else {
      const res = await api('/api/expenses', { method: 'POST', body });
      saveMyRequestId(res.id);
      toast('請款申請已送出');
    }
    resetForm();
    document.getElementById('fDate').value = todayStr();
    loadList();
  } catch (e) { toast(e.message, true); }
}

function statusBadge(status) {
  const map = {
    submitted: ['待記帳', 'bg-amber-100 text-amber-700'],
    booked: ['已記帳待簽收', 'bg-blue-100 text-blue-700'],
    archived: ['已完成入帳', 'bg-emerald-100 text-emerald-700']
  };
  const [label, cls] = map[status] || [status, 'bg-slate-100 text-slate-500'];
  return `<span class="badge ${cls}">${label}</span>`;
}

let myRequests = [];

async function loadList() {
  const month = document.getElementById('monthFilter').value;
  const c = document.getElementById('reqList');
  const ids = getMyRequestIds();
  if (ids.length === 0) {
    c.innerHTML = '<p class="text-center text-slate-300 text-lg py-8">尚無紀錄</p>';
    return;
  }
  try {
    const data = await api('/api/expenses?ids=' + ids.join(','));
    myRequests = data.requests;
    let requests = myRequests;
    if (month) requests = requests.filter(r => r.expense_date.startsWith(month));
    if (requests.length === 0) {
      c.innerHTML = '<p class="text-center text-slate-300 text-lg py-8">尚無紀錄</p>';
      return;
    }
    c.innerHTML = requests.map(r => `
      <div class="border border-slate-100 rounded-xl p-3">
        <div class="flex items-start justify-between gap-2">
          <div>
            <div class="font-black text-lg text-slate-700">${esc(r.purpose)}</div>
            <div class="text-[15px] text-slate-400 font-medium mt-0.5">花費日期 ${r.expense_date} ・ 請款人 ${esc(r.requester)} ・ 請款日期 ${r.request_date}</div>
          </div>
          ${statusBadge(r.status)}
        </div>
        <div class="mt-2 flex flex-wrap gap-1">
          ${r.items.map(it => `<span class="text-[14px] bg-slate-50 border border-slate-100 rounded-lg px-2 py-1 text-slate-500 font-bold">${esc(it.name)} ×${it.qty} = ${fmtMoney(it.total)}</span>`).join('')}
        </div>
        ${r.receipts && r.receipts.length ? `<div class="mt-2 flex flex-wrap gap-2">${r.receipts.map(rc => receiptThumbHTML(rc.file_key, false)).join('')}</div>` : ''}
        <div class="mt-2 flex items-center justify-between">
          ${r.status === 'submitted' ? `<button onclick="editRequestById('${r.id}')" class="text-[15px] font-bold text-indigo-600 px-2 py-1 rounded-lg hover:bg-indigo-50">編輯</button>` : '<span></span>'}
          <div class="font-black text-indigo-600 text-lg">${fmtMoney(r.total_amount)}</div>
        </div>
      </div>
    `).join('');
  } catch (e) { toast(e.message, true); }
}

function editRequestById(id) {
  const r = myRequests.find(x => x.id === id);
  if (r) editRequest(r);
}

document.getElementById('fDate').value = todayStr();
document.getElementById('monthFilter').addEventListener('change', loadList);
addItemRow();
renderReceiptThumbs();
renderPurposeChips();
loadList();
registerSW();
</script>
</body>
</html>
