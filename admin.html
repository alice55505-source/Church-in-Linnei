<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>林內召會收支記帳 - 管理</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1e293b">
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { font-family:'Inter',"Microsoft JhengHei",sans-serif; background:#F8FAFC; }
  input { font-size:16px !important; }
  .card { background:#fff; border:1px solid #e2e8f0; border-radius:16px; }
</style>
</head>
<body class="text-slate-900 min-h-screen pb-16">

<header class="sticky top-0 z-40 bg-white/85 backdrop-blur border-b border-slate-200/60">
  <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 bg-slate-800 rounded-xl flex items-center justify-center text-white font-black text-lg">林</div>
      <span class="font-black text-slate-800 text-lg">管理（不公開）</span>
    </div>
    <div class="flex items-center gap-3 text-base font-bold">
      <a href="/" class="text-slate-400 hover:text-indigo-600">請款</a>
      <a href="/income.html" class="text-slate-400 hover:text-indigo-600">奉獻</a>
      <a href="/ledger.html" class="text-slate-400 hover:text-indigo-600">記帳</a>
      <button id="logoutBtn" onclick="doLogout()" class="hidden text-rose-500">登出</button>
    </div>
  </div>
</header>

<main class="max-w-3xl mx-auto px-4 pt-5 space-y-5">

  <div id="loginGate" class="card p-6 space-y-3">
    <h2 class="text-lg font-black text-slate-500">請使用管理員 Google 帳號登入</h2>
    <div id="googleSignInBtn"></div>
    <p id="googleSignInHint" class="hidden text-[15px] text-rose-500">系統尚未設定 Google 登入，請聯絡管理員設定 GOOGLE_CLIENT_ID。</p>
  </div>

  <div id="mainContent" class="hidden space-y-5">
    <div class="card p-5 space-y-3">
      <h2 class="text-lg font-black text-slate-400 uppercase tracking-widest">重設奉獻密碼</h2>
      <p class="text-[15px] text-slate-400">只有管理員（Google 登入）能在這裡直接重設奉獻密碼，不需要知道原密碼。</p>
      <input type="password" id="newIncomePw" placeholder="新的奉獻密碼" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-100 rounded-xl outline-none text-lg font-bold">
      <button onclick="resetIncomePw()" class="w-full bg-slate-800 text-white py-3 rounded-xl font-black text-lg">重設密碼</button>
    </div>
  </div>

</main>

<script src="/assets/common.js"></script>
<script>
function waitForGoogleGSI(timeoutMs) {
  return new Promise(resolve => {
    const start = Date.now();
    (function poll() {
      if (window.google && window.google.accounts && window.google.accounts.id) return resolve(true);
      if (Date.now() - start > timeoutMs) return resolve(false);
      setTimeout(poll, 100);
    })();
  });
}
async function initGoogleSignIn() {
  const { client_id } = await api('/api/auth/google-client-id').catch(() => ({ client_id: '' }));
  const gsiReady = await waitForGoogleGSI(5000);
  if (!client_id || !gsiReady) {
    document.getElementById('googleSignInHint').classList.remove('hidden');
    return;
  }
  google.accounts.id.initialize({ client_id, callback: handleGoogleCredential });
  google.accounts.id.renderButton(document.getElementById('googleSignInBtn'), { theme: 'outline', size: 'large', text: 'signin_with' });
}
async function handleGoogleCredential(response) {
  try {
    await api('/api/auth/google-login', { method: 'POST', body: { credential: response.credential } });
    checkLogin();
  } catch (e) { toast(e.message, true); }
}
async function doLogout() { await api('/api/auth/logout', { method: 'POST' }); location.reload(); }

async function checkLogin() {
  const me = await api('/api/auth/me');
  if (me.tier === 'ledger') {
    document.getElementById('loginGate').classList.add('hidden');
    document.getElementById('mainContent').classList.remove('hidden');
    document.getElementById('logoutBtn').classList.remove('hidden');
  } else {
    document.getElementById('loginGate').classList.remove('hidden');
    document.getElementById('mainContent').classList.add('hidden');
  }
}

async function resetIncomePw() {
  const new_password = document.getElementById('newIncomePw').value;
  if (!new_password) return toast('請輸入新密碼', true);
  try {
    await api('/api/auth/admin-set-income-password', { method: 'POST', body: { new_password } });
    toast('奉獻密碼已重設');
    document.getElementById('newIncomePw').value = '';
  } catch (e) { toast(e.message, true); }
}

checkLogin();
initGoogleSignIn();
registerSW();
</script>
</body>
</html>
